name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: vikunja_ics_conv:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          # A throwaway cred.json: the container must start, serve /healthz, and
          # 404 an unknown secret. No network call to Vikunja is made.
          cat > cred.json <<'JSON'
          {
            "ci_smoke_test_secret_not_real_0": {
              "base": "https://vikunja.invalid",
              "project_id": 1,
              "api_key": "tk_ci_smoke_test_not_a_real_token"
            }
          }
          JSON
          docker run -d --name smoke -p 8080:8080 \
            -v "$PWD/cred.json:/config/cred.json:ro" vikunja_ics_conv:ci
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          test "$(curl -s http://127.0.0.1:8080/healthz)" = "ok"
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8080/calendar/definitely_not_a_configured_secret)" = "404"
          docker logs smoke
          docker rm -f smoke
