[package]
name = "vikunja_ics_conv"
version = "0.1.3"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
html2text = "0.17.1"
ics = "0.5"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls", "http2", "gzip", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.9.8"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = true
strip = true
